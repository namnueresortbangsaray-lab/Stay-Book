upstream staybook_web {
  server web:8080;
  keepalive 16;
}

server {
  listen 80;
  server_name _;
  server_tokens off;
  charset utf-8;

  # Uploads are limited to 5 MiB by the app; allow the multipart overhead.
  client_max_body_size 6m;

  gzip on;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json image/svg+xml text/csv;

  # Static security headers are owned by Nginx; the CSP (with its per-request nonce) comes from the app.
  proxy_hide_header X-Frame-Options;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header Permissions-Policy;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_read_timeout 60s;

  location ~ /\. {
    deny all;
    return 404;
  }

  # Versioned assets (asp-append-version adds ?v=hash) can be cached for a year.
  location ~ ^/(css|js|images|fonts)/ {
    proxy_pass http://staybook_web;
    expires 7d;
    if ($arg_v) {
      expires 1y;
    }
  }

  location = /health {
    access_log off;
    proxy_pass http://staybook_web;
  }

  location / {
    proxy_pass http://staybook_web;
  }
}
