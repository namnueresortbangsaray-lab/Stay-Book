upstream php_backend { server php:9000; }
server {
  listen 80;
  server_name _;
  root /var/www/html/public;
  index index.php;
  charset utf-8;
  client_max_body_size 6m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  include /etc/nginx/snippets/security-headers.conf;
  location = /health { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
  location /build/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
  location /images/ { try_files $uri =404; expires 7d; }
  location /_protected_uploads/ { internal; alias /var/www/html/storage/app/uploads/; }
  location ~ /(?:\.|storage/|vendor/|composer\.|.*\.sqlite) { deny all; }
  location / { try_files $uri $uri/ /index.php?$query_string; }
  location ~ \.php$ {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTP_PROXY "";
    fastcgi_pass php_backend;
    fastcgi_read_timeout 60s;
  }
}
