[global]
error_log = /var/www/html/storage/logs/php-fpm-error.log

[www]
listen = 9000
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
catch_workers_output = yes
access.log = /var/www/html/storage/logs/php-fpm-access.log
clear_env = no
ping.path = /fpm-ping
ping.response = pong
