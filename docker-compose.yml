services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: .env
    environment:
      SQLITE_PATH: /var/www/html/storage/database/stay_book.sqlite
    volumes:
      - staybook_database:/var/www/html/storage/database
      - staybook_uploads:/var/www/html/storage/app/uploads
      - staybook_backups:/var/www/html/storage/backups
      - staybook_sessions:/var/www/html/storage/sessions
      - staybook_logs:/var/www/html/storage/logs
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - staybook_uploads:/var/www/html/storage/app/uploads:ro
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  postgres:
    image: postgres:15-alpine
    profiles: ["pgtest"]
    environment:
      POSTGRES_DB: ${SUPABASE_DB_NAME:-postgres}
      POSTGRES_USER: ${SUPABASE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${SUPABASE_DB_PASSWORD:-postgres}
    volumes:
      - staybook_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  staybook_database:
  staybook_uploads:
  staybook_backups:
  staybook_sessions:
  staybook_logs:
  staybook_postgres:
