# Stay Book: ASP.NET Core on Kestrel with SQLite in named volumes.
#   cp .env.example .env && docker compose up -d --build   ->  http://localhost:8080
# The project and volume names are those of v1, so an existing installation keeps its database and uploads.
name: stay-book

services:
  # Existing volumes may belong to the v1 image's www-data (uid 82); the app runs as uid 1654.
  storage-init:
    image: busybox:1.37
    command:
      - sh
      - -c
      - mkdir -p /storage/database /storage/uploads /storage/backups /storage/logs /storage/keys && chown -R 1654:1654 /storage
    volumes:
      - staybook_database:/storage/database
      - staybook_uploads:/storage/uploads
      - staybook_backups:/storage/backups
      - staybook_logs:/storage/logs
      - staybook_keys:/storage/keys

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: staybook-web:latest
    env_file: .env
    environment:
      ConnectionStrings__Sqlite: Data Source=/app/storage/database/staybook.db
      Storage__UploadsPath: /app/storage/uploads
      Storage__BackupsPath: /app/storage/backups
      Storage__LogsPath: /app/storage/logs
      Storage__KeysPath: /app/storage/keys
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - staybook_database:/app/storage/database
      - staybook_uploads:/app/storage/uploads
      - staybook_backups:/app/storage/backups
      - staybook_logs:/app/storage/logs
      - staybook_keys:/app/storage/keys
    depends_on:
      storage-init:
        condition: service_completed_successfully

  # Local PostgreSQL 15 for testing the Supabase provider: docker compose --profile pgtest up -d postgres
  postgres:
    image: postgres:15-alpine
    profiles: ["pgtest"]
    environment:
      POSTGRES_DB: ${SUPABASE_DB_NAME:-postgres}
      POSTGRES_USER: ${SUPABASE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${SUPABASE_DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - staybook_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  staybook_database:
  staybook_uploads:
  staybook_backups:
  staybook_logs:
  staybook_keys:
  staybook_postgres:
