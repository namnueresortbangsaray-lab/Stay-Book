name: stay_book
description: "Stay Book — สมุดบันทึกผู้เข้าพักของน้ำเหนือรีสอร์ทบางเสร่ ทำงานบนเครื่องเดียว ไม่ต้องใช้อินเทอร์เน็ต"
# ไม่เผยแพร่ขึ้น pub.dev เพราะเป็นแอปใช้งานภายใน ไม่ใช่ไลบรารี
publish_to: 'none'

version: 1.0.0+1

environment:
  # ต้องใช้ Dart 3.9 ขึ้นไป (Flutter 3.35+) เพราะโค้ดใช้พารามิเตอร์ initialValue
  # ของ DropdownButtonFormField ซึ่งเพิ่มเข้ามาในรุ่นนั้น
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ฐานข้อมูล SQLite บนเครื่อง ใช้เก็บข้อมูลห้องพักและรายการเข้าพักทั้งหมด
  sqflite: ^2.4.2

  # ใช้ต่อ path ของไฟล์ฐานข้อมูลให้ถูกต้องตามระบบปฏิบัติการ
  path: ^1.9.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # โลโก้ของรีสอร์ท เก็บเป็นไฟล์ .webp เพราะขนาดเล็กกว่า .png ที่คุณภาพเท่ากัน
  # และ Flutter รองรับ webp บน Android ได้โดยตรงอยู่แล้ว
  assets:
    - assets/images/logo.webp         # โลโก้สีเขียว พื้นโปร่งใส ใช้บนพื้นอ่อน
    - assets/images/logo_white.webp   # โลโก้สีขาวล้วน พื้นโปร่งใส ใช้บนพื้นเขียวเข้ม
    - assets/images/logo_square.webp  # โลโก้จัตุรัสพื้นทึบ อ่านคำว่าบางเสร่ได้ชัด
    - assets/images/logo_banner.webp  # ป้ายชื่อแนวนอนพร้อมสโลแกน ใช้ในหน้าเปิดแอป
