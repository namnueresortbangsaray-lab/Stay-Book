name: stay_book
description: "Stay Book — สมุดบันทึกผู้เข้าพักสำหรับรีสอร์ทขนาดเล็ก ทำงานบนเครื่องเดียว ไม่ต้องใช้อินเทอร์เน็ต"
# ไม่เผยแพร่ขึ้น pub.dev เพราะเป็นแอปใช้งานภายใน ไม่ใช่ไลบรารี
publish_to: 'none'

version: 1.0.0+1

environment:
  # เปิดช่วงเวอร์ชันให้กว้างพอสมควร จะได้เปิดโปรเจกต์บนเครื่องอื่นที่ Flutter ไม่ใหม่เท่ากันได้
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ฐานข้อมูล SQLite บนเครื่อง ใช้เก็บข้อมูลห้องพักและรายการเข้าพักทั้งหมด
  sqflite: ^2.4.2

  # ใช้ต่อ path ของไฟล์ฐานข้อมูลให้ถูกต้องตามระบบปฏิบัติการ
  path: ^1.9.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
