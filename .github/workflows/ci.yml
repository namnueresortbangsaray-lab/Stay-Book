name: CI
on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/ResortGuestbook.Web/package-lock.json
      - name: Front-end build
        working-directory: src/ResortGuestbook.Web
        run: npm ci && npm run lint && npm run build
      - run: dotnet tool restore
      - run: dotnet restore ResortGuestbook.sln
      - name: Build (warnings as errors)
        run: dotnet build ResortGuestbook.sln -c Release --no-restore
      - name: Format check
        run: dotnet format ResortGuestbook.sln --verify-no-changes --no-restore
      - name: Tests (SQLite + PostgreSQL via Testcontainers + baseline contract)
        run: dotnet test ResortGuestbook.sln -c Release --no-build --logger "console;verbosity=normal"

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build web
      - name: Start and wait for health
        run: |
          docker compose up -d web
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' stay-book-web-1)" = healthy ] && break
            sleep 3
          done
          docker compose ps
          curl -fsS http://localhost:8080/health
      - name: Smoke test
        run: sudo apt-get install -y jq && sh tests/smoke/smoke-test.sh
